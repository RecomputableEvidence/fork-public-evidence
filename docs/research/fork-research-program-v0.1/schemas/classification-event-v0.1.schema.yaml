$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://fork.example/schemas/classification-event-v0.1.schema.json"
title: Fork Classification Event v0.1
description: >-
  Provisional schema for an attributable, profile-bound classification of a
  transformation. Presence does not confer truth, correctness, authority, or
  conformance.
type: object
additionalProperties: false
required:
  - schema_version
  - event_id
  - transformation_id
  - evaluator
  - performed_at
  - procedure
  - profile
  - inputs
  - result
  - classification_basis
  - scope
  - standing
properties:
  schema_version:
    const: "0.1"
  event_id:
    type: string
    minLength: 1
  transformation_id:
    type: string
    minLength: 1
  evaluator:
    type: object
    additionalProperties: false
    required: [id, type]
    properties:
      id: {type: string, minLength: 1}
      type:
        enum: [HUMAN, SOFTWARE, MODEL, HYBRID]
      affiliation: {type: [string, "null"]}
      conflicts_disclosed:
        type: array
        items: {type: string}
  performed_at:
    type: string
    format: date-time
  procedure:
    type: object
    additionalProperties: false
    required: [id, version]
    properties:
      id: {type: string, minLength: 1}
      version: {type: string, minLength: 1}
      digest: {type: [string, "null"], pattern: "^[a-fA-F0-9]{64}$"}
  profile:
    type: object
    additionalProperties: false
    required: [status, id, version]
    properties:
      status:
        enum: [DECLARED, UNAVAILABLE, NOT_APPLICABLE]
      id: {type: [string, "null"]}
      version: {type: [string, "null"]}
      digest: {type: [string, "null"], pattern: "^[a-fA-F0-9]{64}$"}
    allOf:
      - if:
          properties: {status: {const: DECLARED}}
        then:
          properties:
            id: {type: string, minLength: 1}
            version: {type: string, minLength: 1}
  inputs:
    type: object
    additionalProperties: false
    required: [source_state_digest, target_state_digest]
    properties:
      source_state_digest:
        type: string
        pattern: "^[a-fA-F0-9]{64}$"
      target_state_digest:
        type: string
        pattern: "^[a-fA-F0-9]{64}$"
      transformation_receipt_digest:
        type: [string, "null"]
        pattern: "^[a-fA-F0-9]{64}$"
  result:
    type: object
    additionalProperties: false
    required: [dimension, classification]
    properties:
      dimension:
        enum: [STATE_RELATION]
      classification:
        enum:
          - PRESERVED
          - NARROWED
          - EXPANDED
          - OMITTED
          - SPLIT
          - MERGED
          - SUPERSEDED
          - CONTRADICTED
          - RE_ESTABLISHED
          - LOSSY
          - UNRESOLVED
  classification_basis:
    type: object
    additionalProperties: false
    required: [evidence_references, rules_applied, assumptions, unresolved]
    properties:
      evidence_references:
        type: array
        items: {type: string, minLength: 1}
      rules_applied:
        type: array
        items: {type: string, minLength: 1}
      assumptions:
        type: array
        items: {type: string}
      unresolved:
        type: array
        items: {type: string}
  scope:
    type: object
    additionalProperties: false
    required: [object_scope, exclusions]
    properties:
      object_scope:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      exclusions:
        type: array
        items: {type: string}
  standing:
    type: object
    additionalProperties: false
    required: [evidentiary_support, recomputability]
    properties:
      evidentiary_support:
        enum: [SUPPORTED, PARTIALLY_SUPPORTED, UNSUPPORTED, CONTRADICTORY]
      recomputability:
        enum:
          - RECOMPUTABLE
          - RECOMPUTABLE_WITHIN_DECLARED_SCOPE
          - NOT_RECOMPUTABLE
          - UNKNOWN
  supersedes_event_ids:
    type: array
    items: {type: string, minLength: 1}
  explicit_non_claims:
    type: array
    items:
      enum:
        - TRUTH_NOT_ESTABLISHED
        - CORRECTNESS_NOT_ESTABLISHED
        - AUTHORITY_NOT_CONFERRED
        - CONFORMANCE_NOT_ESTABLISHED

