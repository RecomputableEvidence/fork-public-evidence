name: Current Standing Structural Check

on:
  pull_request:
    paths:
      - 'CURRENT_STANDING.md'
      - 'README.md'
      - 'docs/current-standing/**'
      - 'docs/state/CURRENT_STATE_ROUTING_v0_1.json'
      - 'scripts/check_current_standing_v0_1.py'
      - 'scripts/check_current_standing_v0_2.py'
      - 'scripts/check_current_standing_v0_3.py'
      - 'scripts/check_current_standing_v0_4.py'
      - 'scripts/check_current_state_routing_v0_1.py'
      - '.github/workflows/current-standing-structural-check.yml'
  push:
    branches:
      - main
    paths:
      - 'CURRENT_STANDING.md'
      - 'README.md'
      - 'docs/current-standing/**'
      - 'docs/state/CURRENT_STATE_ROUTING_v0_1.json'
      - 'scripts/check_current_standing_v0_1.py'
      - 'scripts/check_current_standing_v0_2.py'
      - 'scripts/check_current_standing_v0_3.py'
      - 'scripts/check_current_standing_v0_4.py'
      - 'scripts/check_current_state_routing_v0_1.py'
      - '.github/workflows/current-standing-structural-check.yml'

permissions:
  contents: read

jobs:
  check-current-standing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check historical v0.1 current-standing register
        run: python scripts/check_current_standing_v0_1.py
      - name: Check v0.2 successor overlay
        run: python scripts/check_current_standing_v0_2.py
      - name: Check v0.3 Lens Shift successor overlay
        run: python scripts/check_current_standing_v0_3.py
      - name: Check v0.4 UEM Epoch 010 successor overlay
        run: python scripts/check_current_standing_v0_4.py
      - name: Check current routing and v0.5-v0.7 successor bindings
        run: python scripts/check_current_state_routing_v0_1.py --json
