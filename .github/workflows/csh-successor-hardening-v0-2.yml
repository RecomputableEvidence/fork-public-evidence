name: CSH Successor Hardening v0.2
on:
  pull_request:
  push:
    branches:
      - main
      - 'repair/csh-offline-hardening-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-hardening:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-proof-surface.txt
      - name: Offline regression tests
        run: python -m pytest tests/test_csh_successor_hardening_v0_2.py tests/test_day0_schema_v0_2.py -q
      - name: Recompute preserved predecessor findings
        run: python scripts/reproduce_csh_offline_findings_v0_2.py --check
      - name: Materialize candidate packets
        run: python tools/build_csh_s001_packets_v0_1.py --output-dir csh-v02-candidate --json
      - name: Verify actual packet bytes
        run: python tools/check_csh_s001_packet_binding_v0_2.py csh-v02-candidate --json
      - name: Validate Day-0 successor schema bundle
        run: python tools/validate_json_schema_bundle_v0_2.py --json
      - name: Verify change accounting
        run: python scripts/check_standing_freshness_v0_1.py --json
