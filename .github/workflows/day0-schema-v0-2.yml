name: Day-0 Schema v0.2

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  day0-schema:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-proof-surface.txt
      - name: Validate successor schema bundle
        run: python tools/validate_json_schema_bundle_v0_2.py --json
      - name: Test successor schema
        run: python -m pytest tests/test_day0_schema_v0_2.py -q
      - name: Verify original Day-0 packet
        run: python tools/check_longitudinal_reconstruction_day0_packet_v0_1.py --json
