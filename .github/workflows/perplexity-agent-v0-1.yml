name: Perplexity Agent integration v0.1
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-agent:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-proof-surface.txt -r requirements-perplexity-agent.txt
      - run: python -m pytest tests/test_perplexity_agent_answer_v0_1.py -q
      - run: python scripts/check_standing_freshness_v0_1.py --json
