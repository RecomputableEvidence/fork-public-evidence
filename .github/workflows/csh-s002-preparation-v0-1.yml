name: CSH-S002 offline preparation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # First-parent accounting must inspect the PR head, not a synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-proof-surface.txt -r requirements-perplexity-agent.txt
      - run: python -m pytest tests/test_csh_s002_preparation_v0_1.py tests/test_csh_s002_execution_v0_1.py tests/test_csh_s002_parser_v0_2.py tests/test_csh_s002_continuation_v0_2.py tests/test_csh_s002_coding_v0_1.py -q
      - run: python tools/prepare_csh_s002_v0_1.py --output-dir s002-offline-plan
      - run: python tools/prepare_csh_s002_coding_v0_1.py
      - run: python tools/continue_csh_s002_v0_2.py
      - run: python tools/run_csh_s002_v0_1.py
      - run: python scripts/check_standing_freshness_v0_1.py --json
