name: Preservation Governance Lineage v0.1

on:
  push:
    branches:
      - preservation/clean-continuance-v0.1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preservation-governance-lineage:
    name: Preservation merge-lineage witness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify governed first-parent merge topology
        run: >-
          python tools/check_preservation_branch_enforcement_readiness_v0_1.py
          --lineage-only
          --target HEAD
