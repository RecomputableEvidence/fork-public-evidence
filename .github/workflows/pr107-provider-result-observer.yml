name: PR107 provider-result observer

on:
  pull_request:
    paths:
      - ".github/workflows/pr107-provider-result-observer.yml"
      - "docs/preservation/admission/pr107-provider-result/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: pr107-provider-result-observer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  observe-existing-provider-run:
    name: Observe exact merged provider run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: 5cf581c7b95c5ea4e9b662e089fc89f5b552696f
      WORKFLOW_NAME: CSH Provider Validation v0.1.2
      EXPECTED_ARTIFACT: csh-provider-validation-5cf581c7b95c5ea4e9b662e089fc89f5b552696f
      EXPECTED_REQUEST_SHA256: d2c8aabbdda4f17509395aa8a55f607b2b0d52138a251e8da92bb8384a05bcef
    steps:
      - name: Checkout successor branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Locate exact existing push run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p observer-output/receipt
          for attempt in $(seq 1 30); do
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${MERGE_SHA}&event=push&per_page=100" \
              > /tmp/pr107-runs.json
            python - <<'PY' > /tmp/pr107-selected-run.json
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/pr107-runs.json').read_text(encoding='utf-8'))
          exact = [
              run for run in payload.get('workflow_runs', [])
              if run.get('head_sha') == os.environ['MERGE_SHA']
              and run.get('event') == 'push'
              and run.get('name') == os.environ['WORKFLOW_NAME']
          ]
          if len(exact) > 1:
              exact.sort(key=lambda item: int(item['id']))
          if exact:
              print(json.dumps(exact[-1], sort_keys=True))
          PY
            if test -s /tmp/pr107-selected-run.json; then
              status=$(python -c "import json; print(json.load(open('/tmp/pr107-selected-run.json'))['status'])")
              if test "$status" = "completed"; then
                break
              fi
            fi
            sleep 10
          done
          test -s /tmp/pr107-selected-run.json
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path('/tmp/pr107-selected-run.json').read_text(encoding='utf-8'))
          if run.get('status') != 'completed':
              raise SystemExit(f"exact provider run did not complete: {run.get('status')}")
          selected = {
              key: run.get(key)
              for key in (
                  'id', 'name', 'event', 'status', 'conclusion', 'head_sha',
                  'run_number', 'run_attempt', 'created_at', 'updated_at',
                  'html_url', 'artifacts_url', 'jobs_url'
              )
          }
          Path('observer-output/RUN_METADATA.json').write_text(
              json.dumps(selected, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          Path('/tmp/pr107-run-id').write_text(str(run['id']), encoding='utf-8')
          PY

      - name: Download only the existing provider receipt artifact
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(cat /tmp/pr107-run-id)
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            > /tmp/pr107-artifacts.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('/tmp/pr107-artifacts.json').read_text(encoding='utf-8'))
          exact = [
              item for item in payload.get('artifacts', [])
              if item.get('name') == os.environ['EXPECTED_ARTIFACT']
              and item.get('expired') is False
          ]
          if len(exact) != 1:
              raise SystemExit(f"expected exactly one live provider artifact, found {len(exact)}")
          artifact = exact[0]
          Path('observer-output/ARTIFACT_METADATA.json').write_text(
              json.dumps({
                  key: artifact.get(key)
                  for key in ('id', 'name', 'size_in_bytes', 'expired', 'created_at', 'updated_at', 'expires_at', 'workflow_run')
              }, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          Path('/tmp/pr107-artifact-id').write_text(str(artifact['id']), encoding='utf-8')
          PY
          artifact_id=$(cat /tmp/pr107-artifact-id)
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/pr107-provider-result.zip
          unzip -q /tmp/pr107-provider-result.zip -d observer-output/receipt

      - name: Validate bounded receipt and write observation manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          output = Path('observer-output')
          receipts = list(output.joinpath('receipt').rglob('PROVIDER_VALIDATION_ATTESTATION_v0_1_2.json'))
          if len(receipts) != 1:
              raise SystemExit(f"expected exactly one provider receipt, found {len(receipts)}")
          receipt_path = receipts[0]
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          run = json.loads(output.joinpath('RUN_METADATA.json').read_text(encoding='utf-8'))
          artifact = json.loads(output.joinpath('ARTIFACT_METADATA.json').read_text(encoding='utf-8'))

          calls = receipt.get('calls')
          authorization = receipt.get('authorization')
          required = (
              receipt.get('receipt_id') == 'CSH_PROVIDER_VALIDATION_RECEIPT_v0_1_2'
              and receipt.get('schema_version') == 'v0.1.2'
              and receipt.get('classification') == 'PROVIDER_VALIDATION_ONLY_EXCLUDED_FROM_CSH_BASELINE'
              and receipt.get('validation_mode') == 'UPPERCASE_DEEPSEEK_ONLY'
              and receipt.get('subject_commit') == os.environ['MERGE_SHA']
              and receipt.get('workflow_run_id') == run.get('id')
              and receipt.get('provider_validation_calls_performed') == 1
              and receipt.get('pair_001_calls_performed') == 0
              and receipt.get('experiment_run_ids_created') == []
              and isinstance(calls, list) and len(calls) == 1
              and calls[0].get('requested_model') == 'deepseek/DeepSeek-V3-0324'
              and isinstance(authorization, dict)
              and authorization.get('maximum_provider_calls') == 1
              and authorization.get('request_sha256') == os.environ['EXPECTED_REQUEST_SHA256']
              and authorization.get('pair_001_execution_authorized') is False
              and authorization.get('readiness_promotion_authorized') is False
          )
          if not required:
              raise SystemExit('provider receipt violates the bounded observation contract')

          files = []
          for path in sorted(item for item in output.rglob('*') if item.is_file()):
              data = path.read_bytes()
              files.append({
                  'path': path.relative_to(output).as_posix(),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size_bytes': len(data),
              })
          manifest = {
              'schema_version': 'v0.1',
              'record_kind': 'pr107_provider_result_observation_package',
              'subject_merge_commit': os.environ['MERGE_SHA'],
              'source_workflow_run_id': run['id'],
              'source_workflow_conclusion': run.get('conclusion'),
              'provider_receipt_status': receipt.get('status'),
              'provider_http_status': calls[0].get('http_status'),
              'provider_response_body_sha256': calls[0].get('response_body_sha256'),
              'provider_validation_calls_performed': 1,
              'pair_001_calls_performed': 0,
              'files': files,
              'standing': 'EXACT_EXISTING_PROVIDER_RESULT_OBSERVED_NOT_ADMITTED',
              'effects': {
                  'provider_calls_performed_by_observer': 0,
                  'workflow_reruns_requested': 0,
                  'repository_refs_modified': 0,
                  'admission_effect': 'NONE',
              },
              'non_claims': [
                  'Observation is not admission.',
                  'Provider success or failure does not authorize Pair-001.',
                  'Provider success or failure does not promote readiness.',
                  'The observer did not issue or repeat a provider request.',
              ],
          }
          output.joinpath('OBSERVATION_MANIFEST.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps({
              'run_id': run['id'],
              'run_conclusion': run.get('conclusion'),
              'receipt_status': receipt.get('status'),
              'http_status': calls[0].get('http_status'),
              'response_body_sha256': calls[0].get('response_body_sha256'),
          }, sort_keys=True))
          PY

      - name: Upload bounded observation package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr107-provider-result-observation-${{ github.sha }}
          path: observer-output
          if-no-files-found: error
          retention-days: 7
