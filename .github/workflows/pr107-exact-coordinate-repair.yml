name: PR107 exact-coordinate repair

on:
  push:
    branches:
      - agent/csh-uppercase-retry-current-line-v0-1

permissions:
  contents: read

concurrency:
  group: pr107-exact-coordinate-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-repair:
    name: Generate bounded exact-coordinate repair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install deterministic checker dependencies
        run: >-
          python -m pip install --require-hashes
          -r requirements-proof-surface.lock.txt
          -r requirements-claim-admission.lock.txt

      - name: Patch historical consumers to exact coordinates
        run: python tools/pr107_exact_coordinate_repair.py

      - name: Regenerate deterministic current-line and replay artifacts
        run: |
          python tools/check_fork_sequence_surface_v0_1.py \
            --write-projection docs/sequence-surface/PAIR_001_SEQUENCE_PROJECTION_v0_1.json
          python tools/check_temporal_succession_v0_1.py
          python tools/check_longitudinal_recomputation_v0_2.py --write-derived
          python tools/check_longitudinal_causal_reconciliation_v0_3.py --write-derived
          python tools/run_proof_001_review_does_not_silently_travel_v0_1.py \
            --render-summary-only > \
            docs/proof-atlas/PROOF-001-review-does-not-silently-travel-v0.1/PROOF-SUMMARY.md

      - name: Refresh Proof 001 manifest bindings
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          target = root / "docs/proof-atlas/PROOF-001-review-does-not-silently-travel-v0.1/PROOF-MANIFEST.json"
          payload = json.loads(target.read_text(encoding="utf-8"))
          for entry in payload["bindings"]:
              data = (root / entry["path"]).read_bytes()
              entry["sha256"] = hashlib.sha256(data).hexdigest()
              entry["size_bytes"] = len(data)
          target.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Verify repaired dependency chain
        run: |
          python -m pytest \
            tests/test_fork_sequence_surface_v0_1.py \
            tests/test_temporal_succession_v0_1.py \
            tests/test_longitudinal_recomputation_v0_2.py \
            tests/test_longitudinal_causal_reconciliation_v0_3.py \
            tests/test_fork_thesis_manifestation_v0_1.py \
            tests/test_proof_001_review_does_not_silently_travel_v0_1.py \
            -q
          python -m pytest -q

      - name: Assemble repair artifact
        shell: bash
        run: |
          rm -rf repair-output
          mkdir -p repair-output/files
          while IFS= read -r -d '' path; do
            mkdir -p "repair-output/files/$(dirname "$path")"
            cp "$path" "repair-output/files/$path"
          done < <(git diff --name-only --diff-filter=ACMRT -z)
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("repair-output/files")
          entries = []
          for path in sorted(item for item in root.rglob("*") if item.is_file()):
              data = path.read_bytes()
              entries.append({
                  "path": path.relative_to(root).as_posix(),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size_bytes": len(data),
              })
          Path("repair-output/REPAIR_MANIFEST.json").write_text(
              json.dumps({
                  "record_kind": "pr107_exact_coordinate_repair_artifact",
                  "source_head": "${{ github.sha }}",
                  "entries": entries,
                  "effects": {
                      "repository_refs": "NONE",
                      "provider_calls": 0,
                      "pair_001_calls": 0,
                      "admission": "NONE"
                  }
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          if not entries:
              raise SystemExit("repair artifact has no changed files")
          PY

      - name: Upload exact-coordinate repair artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr107-exact-coordinate-repair-${{ github.sha }}
          path: repair-output
          if-no-files-found: error
          retention-days: 7
