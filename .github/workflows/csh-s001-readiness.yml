name: CSH-S001 Readiness

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CURRENT_STANDING.md'
      - 'docs/current-standing/**'
      - 'docs/state/CURRENT_STATE_ROUTING_v0_1.json'
      - 'docs/experiments/cross-system-claim-handoff-successor-001-v0.1/**'
      - 'schemas/unsupported_inheritance_*_s001_v0_1.schema.json'
      - 'schemas/csh_s001_execution_attempt_v0_1.schema.json'
      - 'tools/classify_unsupported_inheritance_s001_v0_1.py'
      - 'tools/analyze_csh_s001_v0_1.py'
      - 'tools/preflight_csh_s001_receivers_v0_1.py'
      - 'tools/build_csh_s001_packets_v0_1.py'
      - 'tools/check_csh_s001_pair_difference_v0_1.py'
      - 'tools/check_csh_s001_packet_binding_v0_1.py'
      - 'tools/check_csh_s001_execution_schema_v0_1.py'
      - 'scripts/check_current_state_routing_v0_1.py'
      - 'tests/fixtures/csh_s001/**'
      - 'tests/test_cross_system_claim_handoff_s001_v0_1.py'
      - 'tests/test_analyze_csh_s001_v0_1.py'
      - '.github/workflows/csh-s001-readiness.yml'
  workflow_dispatch:
    inputs:
      run_hosted_preflight:
        description: 'Run neutral Mistral and OpenAI access preflight'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  local-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-proof-surface.txt
      - name: Current-state routing
        run: python scripts/check_current_state_routing_v0_1.py --json
      - name: Successor classifier tests
        run: python -m pytest tests/test_cross_system_claim_handoff_s001_v0_1.py -q
      - name: Successor analysis tests
        run: python -m pytest tests/test_analyze_csh_s001_v0_1.py -q
      - name: Execution-attempt schema boundary
        run: python tools/check_csh_s001_execution_schema_v0_1.py --json
      - name: Materialize exact candidate packets and projections
        run: python tools/build_csh_s001_packets_v0_1.py --output-dir csh-s001-candidate --json
      - name: Verify pair difference is treatment-only
        run: python tools/check_csh_s001_pair_difference_v0_1.py csh-s001-candidate --json
      - name: Verify candidate bytes against preserved packet binding
        run: python tools/check_csh_s001_packet_binding_v0_1.py csh-s001-candidate --json
      - name: Upload candidate packet materialization
        uses: actions/upload-artifact@v4
        with:
          name: csh-s001-candidate-packets
          path: csh-s001-candidate/
      - name: Neutral preflight script parses without credentials
        run: python tools/preflight_csh_s001_receivers_v0_1.py --json --allow-missing-credentials

  hosted-preflight-observation:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe neutral hosted receiver access
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tools/preflight_csh_s001_receivers_v0_1.py \
            --provider mistral \
            --provider openai \
            --output-dir preflight-output \
            --allow-missing-credentials \
            --json
      - name: Upload neutral preflight observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csh-s001-neutral-preflight-observation
          path: preflight-output/
          if-no-files-found: warn

  hosted-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosted_preflight }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run neutral hosted receiver preflight
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tools/preflight_csh_s001_receivers_v0_1.py \
            --provider mistral \
            --provider openai \
            --output-dir preflight-output \
            --json
      - name: Upload preflight records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csh-s001-neutral-preflight
          path: preflight-output/
          if-no-files-found: warn
